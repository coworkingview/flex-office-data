[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "coworkingview"
dynamic = ["version"]
description = "Flexible-office prices (CoworkingView Price Index, CC BY 4.0) and coworking catalogue search as tidy pandas DataFrames."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CoworkingView", email = "info@coworkingview.com" }]
maintainers = [{ name = "CoworkingView", email = "info@coworkingview.com" }]
keywords = [
    "coworking",
    "flexible office",
    "real estate",
    "price index",
    "commercial real estate",
    "proptech",
    "open data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["pandas>=2.0"]

[project.urls]
Homepage = "https://coworkingview.com"
Documentation = "https://github.com/coworkingview/flex-office-data/tree/main/python#readme"
Source = "https://github.com/coworkingview/flex-office-data"
Issues = "https://github.com/coworkingview/flex-office-data/issues"
Changelog = "https://github.com/coworkingview/flex-office-data/blob/main/python/CHANGELOG.md"
"Price Index" = "https://coworkingview.com/en/tools/price-index"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
]

[tool.hatch.version]
path = "src/coworkingview/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/coworkingview"]

[tool.hatch.build.targets.sdist]
include = [
    "src/coworkingview",
    "tests",
    "examples",
    "conda",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

# Ship the shared contract fixtures with the sdist so the golden tests run
# from an unpacked source release (e.g. a conda-forge build), not only from
# the monorepo checkout.
[tool.hatch.build.targets.sdist.force-include]
"../spec/fixtures" = "spec/fixtures"
"../spec/golden" = "spec/golden"
"../spec/tools/make_golden.py" = "spec/tools/make_golden.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: hits the real API; opt in with COWORKINGVIEW_LIVE_TESTS=1"]

[tool.coverage.run]
source = ["coworkingview"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4", "RUF", "D", "PT", "RET", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004", "PLC0415"]
"examples/**" = ["D", "T201"]

[tool.mypy]
strict = true
files = ["src", "tests", "examples"]
