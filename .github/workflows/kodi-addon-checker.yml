name: Kodi add-on checker

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kodi-addon-checker:
    name: kodi-addon-checker (piers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parser tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 integrations/kodi/tests/test_api.py
      - name: Install kodi-addon-checker
        run: python -m pip install --upgrade pip "kodi-addon-checker==0.0.36"
      - name: Check script.coworkingview
        run: |
          set -o pipefail
          rm -rf integrations/kodi/script.coworkingview/resources/lib/__pycache__
          kodi-addon-checker --branch=piers integrations/kodi/script.coworkingview | tee /tmp/kodi-addon-checker.txt
          python3 - << 'PY'
          import pathlib
          import re
          import sys
          text = pathlib.Path("/tmp/kodi-addon-checker.txt").read_text(encoding="utf-8", errors="replace")
          plain = re.sub(r"\x1b\[[0-9;]*m", "", text)
          bad = [
              line
              for line in plain.splitlines()
              if line.startswith("ERROR:") or line.startswith("WARN:")
          ]
          if bad:
              sys.exit(1)
          PY
