name: Eclipse

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "eclipse-v*"

# The github-pages environment allows deploys from refs/heads/main only
# (a tag push is rejected: "not allowed to deploy to github-pages due to
# environment protection rules"). Pages therefore runs on main. The artifact
# is the site root: eclipse/updates/ (the p2 repository), .nojekyll, and
# coworkingview-eclipse-p2.zip. A tag eclipse-v* attaches that zip to the
# GitHub Release. A main run attaches it too when the newest eclipse-v* release
# does not have the asset yet, so the first publish does not depend on moving
# an existing tag.

permissions:
  contents: read

jobs:
  build:
    name: Tycho p2 repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: integrations/eclipse/pom.xml
      - name: Install Maven 3.9.11
        run: |
          set -eu
          curl -fsSL -o /tmp/maven.tgz https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.tar.gz
          tar -xzf /tmp/maven.tgz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"
      - name: Build plug-in, feature, and update site
        working-directory: integrations/eclipse
        run: mvn -B verify
      - name: Pack the p2 repository
        run: |
          set -eu
          site=integrations/eclipse/com.coworkingview.eclipse.site/target/repository
          test -f "$site/content.jar"
          test -f "$site/artifacts.jar"
          test -d "$site/features"
          test -d "$site/plugins"
          mkdir -p dist/eclipse/updates
          cp -a "$site"/. dist/eclipse/updates/
          cp integrations/eclipse/site-index.html dist/eclipse/updates/index.html
          touch dist/.nojekyll
          ( cd "$site" && zip -r "$GITHUB_WORKSPACE/dist/coworkingview-eclipse-p2.zip" . )
          python3 - "$site/content.jar" << 'PY'
          import sys, zipfile
          xml = zipfile.ZipFile(sys.argv[1]).read("content.xml").decode("utf-8", "replace")
          if "com.coworkingview.eclipse.feature" not in xml:
              raise SystemExit("feature is missing from content.xml")
          if "osgi.os" in xml or "osgi.ws" in xml or "osgi.arch" in xml:
              raise SystemExit("update site metadata is filtered to one operating system")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eclipse-update-site
          path: dist
          if-no-files-found: error

  pages:
    name: Publish update site to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: eclipse-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eclipse-update-site
          path: public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Attach p2 zip to the GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/eclipse-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          name: eclipse-update-site
          path: dist
      - name: Upload the zipped p2 repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          if [[ "$GITHUB_REF" == refs/tags/eclipse-v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=$(git tag -l 'eclipse-v*' --sort=-creatordate | head -n 1)
            if [[ -z "$tag" ]]; then
              echo "No eclipse-v* tag; skipping the release upload."
              exit 0
            fi
            if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'coworkingview-eclipse-p2.zip'; then
              echo "Release $tag already has coworkingview-eclipse-p2.zip."
              exit 0
            fi
          fi
          notes=$(cat <<EOF
          Eclipse p2 repository for CoworkingView Workspace Prices.

          Update site (GitHub Pages): https://coworkingview.github.io/flex-office-data/eclipse/updates/

          Zipped repository, if Pages is unavailable:

          \`jar:https://github.com/coworkingview/flex-office-data/releases/download/${tag}/coworkingview-eclipse-p2.zip!/\`
          EOF
          )
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "$notes"
          gh release upload "$tag" dist/coworkingview-eclipse-p2.zip --clobber
