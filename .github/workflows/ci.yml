name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  golden:
    name: Golden files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 spec/tools/make_golden.py && git diff --exit-code spec/golden

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python ${{ matrix.python }} --all-extras --dev
      - run: uv run ruff check && uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  r:
    name: R CMD check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: r
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          args: 'c("--no-manual", "--as-cran")'

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  java:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["11", "21"]
    defaults:
      run:
        working-directory: integrations/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cwv:ci -f rust/Dockerfile rust && docker run --rm cwv:ci --version

  nextcloud:
    name: Nextcloud app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/nextcloud/coworkingview
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer test
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/nextcloud/coworkingview/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  tap-coworkingview:
    name: tap-coworkingview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/meltano/tap-coworkingview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: tap-coworkingview --about --format=json > /dev/null

  joplin:
    name: Joplin plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/joplin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/joplin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - run: test -f publish/com.coworkingview.joplin.jpl
      - run: test -f publish/com.coworkingview.joplin.json

  streamdeck:
    name: Stream Deck plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/streamdeck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/streamdeck/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run validate
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: com.coworkingview.prices.streamDeckPlugin
          path: integrations/streamdeck/com.coworkingview.prices.streamDeckPlugin
          if-no-files-found: error

  matomo:
    name: Matomo plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: PHP syntax
        working-directory: integrations/matomo/CoworkingView
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -name '*.php' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no PHP files found" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done
      - name: plugin.json and parser
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("integrations/matomo/CoworkingView")
          plugin = json.loads((root / "plugin.json").read_text())
          required = [
              "name",
              "description",
              "version",
              "theme",
              "license",
              "keywords",
              "homepage",
              "authors",
              "support",
              "require",
          ]
          missing = [key for key in required if key not in plugin]
          if missing:
              raise SystemExit("plugin.json missing " + ", ".join(missing))
          if plugin["name"] != "CoworkingView":
              raise SystemExit("unexpected plugin name")
          lowered = plugin["name"].lower()
          for banned in ("matomo", "analytics", "plugin"):
              if banned in lowered:
                  raise SystemExit("plugin name contains " + banned)
          if not isinstance(plugin["description"], str) or not plugin["description"]:
              raise SystemExit("description must be a non-empty string")
          if len(plugin["description"]) > 150:
              raise SystemExit("description is longer than 150 characters")
          if plugin["version"] != "0.1.0":
              raise SystemExit("unexpected version")
          if plugin["theme"] is not False:
              raise SystemExit("theme must be false")
          if plugin["license"] != "GPL-3.0+":
              raise SystemExit("unexpected license")
          if plugin["homepage"] != "https://coworkingview.com":
              raise SystemExit("unexpected homepage")
          if plugin["require"].get("matomo") != ">=5.0.0-b1,<6.0.0-b1":
              raise SystemExit("unexpected matomo requirement")
          if plugin["require"].get("php") != ">=8.1.0":
              raise SystemExit("unexpected php requirement")
          if plugin.get("category") != "integration":
              raise SystemExit("unexpected category")
          if "api.coworkingview.com" not in plugin["description"]:
              raise SystemExit("description must name the external API")
          if not plugin["keywords"]:
              raise SystemExit("keywords are required")
          for keyword in plugin["keywords"]:
              if not isinstance(keyword, str) or not keyword.replace("-", "").replace(".", "").isalnum():
                  raise SystemExit("invalid keyword: " + repr(keyword))
          authors = plugin["authors"]
          if not authors or authors[0].get("name") != "CoworkingView":
              raise SystemExit("unexpected authors")
          if authors[0].get("email") != "info@coworkingview.com":
              raise SystemExit("unexpected author email")
          if authors[0].get("homepage") != "https://coworkingview.com":
              raise SystemExit("unexpected author homepage")
          issues = plugin["support"].get("issues")
          if issues != "https://github.com/coworkingview/flex-office-data/issues":
              raise SystemExit("unexpected support.issues")
          for path in root.rglob("*.json"):
              json.loads(path.read_text())
          readme = (root / "README.md").read_text()
          if "https://coworkingview.com" not in readme:
              raise SystemExit("README must link to https://coworkingview.com")
          if "www.coworkingview.com" in readme:
              raise SystemExit("README must not use www.coworkingview.com")
          if "api.coworkingview.com" not in readme:
              raise SystemExit("README must name the external API")
          if "No visitor data is sent" not in readme:
              raise SystemExit("README must include the privacy notice")
          license_text = (root / "LICENSE").read_text()
          if "GNU GENERAL PUBLIC LICENSE" not in license_text:
              raise SystemExit("LICENSE is missing the GPL text")
          print("plugin.json ok")
          PY
          php integrations/matomo/CoworkingView/tests/parser.php

  airbyte-coworkingview:
    name: source-coworkingview manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: YAML lint
        run: |
          python -m pip install 'yamllint==1.35.1'
          yamllint -c integrations/airbyte/.yamllint.yml \
            integrations/airbyte/source-coworkingview \
            integrations/airbyte/upstream-layout
      - name: Upstream layout matches the connector directory
        run: |
          diff -rq \
            integrations/airbyte/source-coworkingview \
            integrations/airbyte/upstream-layout/airbyte-integrations/connectors/source-coworkingview
      - name: airbyte-cdk spec, check, discover and read
        run: |
          python -m pip install 'airbyte-cdk==7.39.1'
          python integrations/airbyte/scripts/validate_manifest.py

  libreoffice:
    name: LibreOffice Calc extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/libreoffice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint, byte-compile, and unit tests
        run: |
          python -m pip install ruff
          ruff check .
          python -m py_compile coworkingview_calc.py pythonpath/coworkingview_api.py tests/test_api.py tests/smoke_eval.py tools/render_icons.py
          python -m unittest discover -s tests -v
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libreoffice-calc python3-uno libreoffice-dev
      - name: Build the extension and run the headless smoke test
        run: |
          ./build.sh
          ./tests/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coworkingview-calc-0.1.0.oxt
          path: integrations/libreoffice/dist/coworkingview-calc-0.1.0.oxt

  backstage:
    name: Backstage plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/backstage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/backstage/package-lock.json
      - run: npm ci
      - run: npm run tsc
      - run: npm run lint
      - run: npm test
      - run: npm run build

  ocaml:
    name: OCaml ${{ matrix.ocaml }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ocaml: ["4.14", "5.3"]
    defaults:
      run:
        working-directory: clients/ocaml
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
      - name: Install dependencies
        run: opam install . --deps-only --with-test --with-doc --yes
      - name: Build, test and documentation
        run: opam exec -- dune build @install @runtest @doc
      - name: opam lint
        run: |
          set -euo pipefail
          # A clean run prints "<file>: Passed." (with colour when OPAMCOLOR=always).
          # Anything else is a warning or an error.
          out=$(opam lint coworkingview.opam opam-repository/packages/coworkingview/coworkingview.0.1.0/opam | sed -E 's/\x1b\[[0-9;]*m//g')
          printf '%s\n' "$out"
          bad=$(printf '%s\n' "$out" | grep -Ev ': Passed\.$' || true)
          test -z "$bad"
      - name: opam-dune-lint
        if: matrix.ocaml == '5.3'
        run: |
          opam install opam-dune-lint --yes
          opam exec -- opam-dune-lint

  swift:
    name: Swift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift build and test
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src/clients/swift \
            swift:5.9 \
            sh -c "swift build && swift test"

  cocoapods:
    name: CocoaPods lib lint
    runs-on: macos-latest
    defaults:
      run:
        working-directory: clients/swift
    steps:
      - uses: actions/checkout@v4
      - name: pod lib lint
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods -N
          fi
          pod lib lint --allow-warnings

  nuxt:
    name: Nuxt module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/nuxt
    env:
      NUXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/nuxt/package-lock.json
      - run: npm ci
      - run: npm run prepack
      - run: npm run lint
      - run: npm run test

  thunderbird:
    name: Thunderbird add-on
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/thunderbird
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/thunderbird/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coworkingview-workspace-prices-0.1.0.xpi
          path: integrations/thunderbird/dist/coworkingview-workspace-prices-0.1.0.xpi
          if-no-files-found: error
