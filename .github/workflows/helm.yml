name: Helm

# helm lint and helm template on every pull request and on main.
# A tag helm-v<chart version> packages cwv-helm and pushes it to
# oci://registry-1.docker.io/coworkingview/cwv-helm (Docker Hub repo
# coworkingview/cwv-helm, not the cwv image), then pushes artifacthub-repo.yml
# to that same repo at the tag artifacthub.io.

on:
  push:
    branches: [main]
    tags: ["helm-v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: helm lint and template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1

      - name: Lint
        run: helm lint integrations/helm/cwv-helm

      - name: Template the defaults
        run: |
          set -euo pipefail
          helm template cwv-helm integrations/helm/cwv-helm > "$RUNNER_TEMP/cwv.yaml"
          grep -q 'image: "docker.io/coworkingview/cwv:0.1.0"' "$RUNNER_TEMP/cwv.yaml"
          grep -q 'readOnlyRootFilesystem: true' "$RUNNER_TEMP/cwv.yaml"
          grep -q -- '- "rates"' "$RUNNER_TEMP/cwv.yaml"
          grep -q 'name: cwv-helm' "$RUNNER_TEMP/cwv.yaml"

      - name: Template a Berlin CSV schedule
        run: |
          set -euo pipefail
          helm template cwv-helm integrations/helm/cwv-helm \
            --set city=berlin \
            --set format=csv \
            --set locale=de \
            --set currency=EUR \
            --set 'products={flex_desk,private_office}' \
            > "$RUNNER_TEMP/berlin.yaml"
          grep -q -- '- --city' "$RUNNER_TEMP/berlin.yaml"
          grep -q -- '- "berlin"' "$RUNNER_TEMP/berlin.yaml"
          grep -q -- '- "flex_desk,private_office"' "$RUNNER_TEMP/berlin.yaml"

      - name: Template cities
        run: |
          set -euo pipefail
          helm template cwv-helm integrations/helm/cwv-helm --set command=cities --set country=DE \
            > "$RUNNER_TEMP/cities.yaml"
          grep -q -- '- "cities"' "$RUNNER_TEMP/cities.yaml"
          grep -q -- '- "DE"' "$RUNNER_TEMP/cities.yaml"

      - name: Which Docker Hub secrets are set
        if: github.event_name == 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
          DOCKERIO_USERNAME: ${{ secrets.DOCKERIO_USERNAME }}
          DOCKERIO_TOKEN: ${{ secrets.DOCKERIO_TOKEN }}
          DOCKERIO_PASSWORD: ${{ secrets.DOCKERIO_PASSWORD }}
        run: |
          set -euo pipefail
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN DOCKERHUB_PASSWORD DOCKER_USERNAME DOCKER_PASSWORD DOCKER_TOKEN DOCKERHUB_ACCESS_TOKEN DOCKER_HUB_USERNAME DOCKER_HUB_TOKEN DOCKER_HUB_PASSWORD DOCKERIO_USERNAME DOCKERIO_TOKEN DOCKERIO_PASSWORD; do
            val="${!name}"
            if [[ -n "$val" ]]; then
              echo "$name=set"
            else
              echo "$name=unset"
            fi
          done

  publish:
    name: Publish the OCI chart
    if: startsWith(github.ref, 'refs/tags/helm-v')
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1

      - name: Install oras
        run: |
          set -euo pipefail
          version=1.2.2
          curl -fsSL -o /tmp/oras.tar.gz \
            "https://github.com/oras-project/oras/releases/download/v${version}/oras_${version}_linux_amd64.tar.gz"
          tar -C /tmp -xzf /tmp/oras.tar.gz oras
          sudo mv /tmp/oras /usr/local/bin/oras
          oras version

      - name: Package
        id: package
        run: |
          set -euo pipefail
          chart=integrations/helm/cwv-helm
          name=$(sed -n 's/^name: *//p' "$chart/Chart.yaml" | head -1 | tr -d '"')
          version=$(sed -n 's/^version: *//p' "$chart/Chart.yaml" | head -1 | tr -d '"')
          # Helm uses the chart name as the repository name under the registry
          # path. cwv-helm must never be cwv: that repository is the image.
          if [[ "$name" != "cwv-helm" ]]; then
            echo "::error::chart name is ${name}; refusing to push because docker.io/coworkingview/cwv is the image"
            exit 1
          fi
          tag="${GITHUB_REF_NAME#helm-v}"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::tag helm-v${tag} does not match Chart.yaml version ${version}"
            exit 1
          fi
          helm lint "$chart"
          helm package "$chart" --destination "$RUNNER_TEMP"
          tgz="$RUNNER_TEMP/cwv-helm-${version}.tgz"
          test -f "$tgz"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "chart=${tgz}" >> "$GITHUB_OUTPUT"

      - name: Push the chart to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
          DOCKERIO_USERNAME: ${{ secrets.DOCKERIO_USERNAME }}
          DOCKERIO_TOKEN: ${{ secrets.DOCKERIO_TOKEN }}
          DOCKERIO_PASSWORD: ${{ secrets.DOCKERIO_PASSWORD }}
        run: |
          set -euo pipefail
          user=""
          pass=""
          pair=""
          pick() {
            local uname_var="$1" pass_var="$2"
            local u="${!uname_var}" p="${!pass_var}"
            if [[ -n "$u" && -n "$p" && -z "$user" ]]; then
              user="$u"
              pass="$p"
              pair="${uname_var}+${pass_var}"
            fi
          }
          pick DOCKERHUB_USERNAME DOCKERHUB_TOKEN
          pick DOCKERHUB_USERNAME DOCKERHUB_PASSWORD
          pick DOCKERHUB_USERNAME DOCKERHUB_ACCESS_TOKEN
          pick DOCKER_USERNAME DOCKER_PASSWORD
          pick DOCKER_USERNAME DOCKER_TOKEN
          pick DOCKER_HUB_USERNAME DOCKER_HUB_TOKEN
          pick DOCKER_HUB_USERNAME DOCKER_HUB_PASSWORD
          pick DOCKERIO_USERNAME DOCKERIO_TOKEN
          pick DOCKERIO_USERNAME DOCKERIO_PASSWORD
          # A token with no username secret: the image publisher is the user coworkingview.
          if [[ -z "$user" ]]; then
            for pass_var in DOCKERHUB_TOKEN DOCKERHUB_PASSWORD DOCKERHUB_ACCESS_TOKEN DOCKER_TOKEN DOCKER_PASSWORD DOCKER_HUB_TOKEN DOCKER_HUB_PASSWORD DOCKERIO_TOKEN DOCKERIO_PASSWORD; do
              p="${!pass_var}"
              if [[ -n "$p" ]]; then
                user="coworkingview"
                pass="$p"
                pair="literal-coworkingview+${pass_var}"
                break
              fi
            done
          fi
          if [[ -z "$user" || -z "$pass" ]]; then
            echo "::error::No Docker Hub username/token secrets are set. Checked DOCKERHUB_*, DOCKER_*, DOCKER_HUB_*, and DOCKERIO_*."
            exit 1
          fi
          echo "Using Docker Hub credentials from ${pair}."
          printf '%s' "$pass" | helm registry login registry-1.docker.io --username "$user" --password-stdin
          push_out=$(helm push "${{ steps.package.outputs.chart }}" oci://registry-1.docker.io/coworkingview)
          echo "$push_out"
          grep -q 'coworkingview/cwv-helm:' <<<"$push_out"
          if grep -E 'coworkingview/cwv:' <<<"$push_out"; then
            echo "::error::push output names the image repository coworkingview/cwv"
            exit 1
          fi
          printf '%s' "$pass" | oras login registry-1.docker.io --username "$user" --password-stdin
          oras push registry-1.docker.io/coworkingview/cwv-helm:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            integrations/helm/cwv-helm/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Confirm the Docker Hub repository is public
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.error, urllib.request
          url = "https://hub.docker.com/v2/repositories/coworkingview/cwv-helm/"
          last = ""
          for attempt in range(1, 9):
              try:
                  with urllib.request.urlopen(url, timeout=30) as resp:
                      data = json.load(resp)
              except urllib.error.HTTPError as err:
                  last = f"HTTP {err.code}"
                  print(f"attempt {attempt}: {last}")
                  time.sleep(5)
                  continue
              private = data.get("is_private")
              print(f"attempt {attempt}: name={data.get('name')} is_private={private}")
              if private is False:
                  raise SystemExit(0)
              last = f"is_private={private}"
              time.sleep(5)
          raise SystemExit(f"coworkingview/cwv-helm is not public ({last})")
          PY

      - name: Pull the chart back anonymously
        run: |
          set -euo pipefail
          version="${{ steps.package.outputs.version }}"
          mkdir -p "$RUNNER_TEMP/docker-empty" "$RUNNER_TEMP/helm-empty" "$RUNNER_TEMP/anon"
          printf '%s\n' '{"auths":{}}' > "$RUNNER_TEMP/docker-empty/config.json"
          printf '%s\n' '{"auths":{}}' > "$RUNNER_TEMP/helm-empty/config.json"
          DOCKER_CONFIG="$RUNNER_TEMP/docker-empty" \
            HELM_REGISTRY_CONFIG="$RUNNER_TEMP/helm-empty/config.json" \
            helm pull "oci://registry-1.docker.io/coworkingview/cwv-helm" \
              --version "$version" --destination "$RUNNER_TEMP/anon"
          tar -tzf "$RUNNER_TEMP/anon/cwv-helm-${version}.tgz" | grep -q 'cwv-helm/Chart.yaml'
          echo "Anonymous helm pull succeeded."
