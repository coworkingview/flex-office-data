name: Helm

# helm lint and helm template on every pull request and on main.
# A tag helm-v<chart version> packages the chart, attaches the .tgz to the
# GitHub release for that tag, and commits helm-repo/index.yaml on main.
# The Helm repository URL is
# https://raw.githubusercontent.com/coworkingview/flex-office-data/main/helm-repo

on:
  push:
    branches: [main]
    tags: ["helm-v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: helm lint and template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1

      - name: Lint
        run: helm lint integrations/helm/cwv

      - name: Template the defaults
        run: |
          set -euo pipefail
          helm template cwv integrations/helm/cwv > "$RUNNER_TEMP/cwv.yaml"
          grep -q 'image: "docker.io/coworkingview/cwv:0.1.0"' "$RUNNER_TEMP/cwv.yaml"
          grep -q 'readOnlyRootFilesystem: true' "$RUNNER_TEMP/cwv.yaml"
          grep -q -- '- "rates"' "$RUNNER_TEMP/cwv.yaml"
          grep -q 'app.kubernetes.io/name: cwv$' "$RUNNER_TEMP/cwv.yaml"

      - name: Template a Berlin CSV schedule
        run: |
          set -euo pipefail
          helm template cwv integrations/helm/cwv \
            --set city=berlin \
            --set format=csv \
            --set locale=de \
            --set currency=EUR \
            --set 'products={flex_desk,private_office}' \
            > "$RUNNER_TEMP/berlin.yaml"
          grep -q -- '- --city' "$RUNNER_TEMP/berlin.yaml"
          grep -q -- '- "berlin"' "$RUNNER_TEMP/berlin.yaml"
          grep -q -- '- "flex_desk,private_office"' "$RUNNER_TEMP/berlin.yaml"

      - name: Template cities
        run: |
          set -euo pipefail
          helm template cwv integrations/helm/cwv --set command=cities --set country=DE \
            > "$RUNNER_TEMP/cities.yaml"
          grep -q -- '- "cities"' "$RUNNER_TEMP/cities.yaml"
          grep -q -- '- "DE"' "$RUNNER_TEMP/cities.yaml"

  publish:
    name: Publish the Helm repository
    if: startsWith(github.ref, 'refs/tags/helm-v')
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1

      - name: Package and attach the chart to the GitHub release
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chart=integrations/helm/cwv
          name=$(sed -n 's/^name: *//p' "$chart/Chart.yaml" | head -1 | tr -d '"')
          version=$(sed -n 's/^version: *//p' "$chart/Chart.yaml" | head -1 | tr -d '"')
          if [[ "$name" != "cwv" ]]; then
            echo "::error::chart name is ${name}; expected cwv"
            exit 1
          fi
          tag="${GITHUB_REF_NAME#helm-v}"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::tag helm-v${tag} does not match Chart.yaml version ${version}"
            exit 1
          fi
          helm lint "$chart"
          mkdir -p "$RUNNER_TEMP/charts"
          helm package "$chart" --destination "$RUNNER_TEMP/charts"
          tgz="$RUNNER_TEMP/charts/cwv-${version}.tgz"
          test -f "$tgz"
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<NOTES
          Helm chart cwv ${version}.

          \`\`\`sh
          helm repo add cwv https://raw.githubusercontent.com/coworkingview/flex-office-data/main/helm-repo
          helm install cwv cwv/cwv --version ${version}
          \`\`\`

          The CronJob runs docker.io/coworkingview/cwv:0.1.0. Price Index data is CC BY 4.0. The chart and the cwv code are MIT.
          NOTES
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$tgz" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$tgz" \
              --repo "$GITHUB_REPOSITORY" \
              --title "cwv Helm chart ${version}" \
              --notes-file "$notes" \
              --verify-tag
          fi
          asset="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/cwv-${version}.tgz"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -L -o /dev/null -w '%{http_code}' "$asset" || true)
            echo "attempt ${attempt}: ${asset} -> ${code}"
            if [[ "$code" == "200" ]]; then
              break
            fi
            sleep 5
          done
          [[ "$code" == "200" ]]
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tgz=${tgz}" >> "$GITHUB_OUTPUT"

      - name: Update helm-repo/index.yaml on main
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: CoworkingView
          GIT_AUTHOR_EMAIL: info@coworkingview.com
          GIT_COMMITTER_NAME: CoworkingView
          GIT_COMMITTER_EMAIL: info@coworkingview.com
        run: |
          set -euo pipefail
          version="${{ steps.package.outputs.version }}"
          git fetch origin main
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"
          if git cat-file -e "origin/main:helm-repo/index.yaml" 2>/dev/null; then
            git show "origin/main:helm-repo/index.yaml" > "$RUNNER_TEMP/index.prev.yaml"
            helm repo index "$RUNNER_TEMP/charts" --url "$url" --merge "$RUNNER_TEMP/index.prev.yaml"
          else
            helm repo index "$RUNNER_TEMP/charts" --url "$url"
          fi
          test -f "$RUNNER_TEMP/charts/index.yaml"
          grep -q "cwv-${version}.tgz" "$RUNNER_TEMP/charts/index.yaml"
          git checkout -B main origin/main
          mkdir -p helm-repo
          cp "$RUNNER_TEMP/charts/index.yaml" helm-repo/index.yaml
          git add helm-repo/index.yaml
          if git diff --cached --quiet; then
            echo "helm-repo/index.yaml is already current."
          else
            git commit -m "Add the cwv ${version} chart to the Helm repository index."
            git push origin main
          fi

      - name: Pull the chart from the Helm repository
        run: |
          set -euo pipefail
          version="${{ steps.package.outputs.version }}"
          repo_url="https://raw.githubusercontent.com/coworkingview/flex-office-data/main/helm-repo"
          for attempt in 1 2 3 4 5 6 7 8; do
            index_code=$(curl -sS -o "$RUNNER_TEMP/index.yaml" -w '%{http_code}' "${repo_url}/index.yaml" || true)
            meta_code=$(curl -sS -o "$RUNNER_TEMP/artifacthub-repo.yml" -w '%{http_code}' "${repo_url}/artifacthub-repo.yml" || true)
            echo "attempt ${attempt}: index.yaml ${index_code}, artifacthub-repo.yml ${meta_code}"
            if [[ "$index_code" == "200" && "$meta_code" == "200" ]] && grep -q "cwv-${version}.tgz" "$RUNNER_TEMP/index.yaml"; then
              break
            fi
            sleep 5
          done
          [[ "$index_code" == "200" && "$meta_code" == "200" ]]
          grep -q "info@coworkingview.com" "$RUNNER_TEMP/artifacthub-repo.yml"
          export HELM_CACHE_HOME="$RUNNER_TEMP/helm-cache"
          export HELM_CONFIG_HOME="$RUNNER_TEMP/helm-config"
          export HELM_DATA_HOME="$RUNNER_TEMP/helm-data"
          helm repo add cwv "$repo_url"
          helm repo update cwv
          helm pull "cwv/cwv" --version "$version" --destination "$RUNNER_TEMP/pulled"
          tar -tzf "$RUNNER_TEMP/pulled/cwv-${version}.tgz" | grep -q 'cwv/Chart.yaml'
          echo "helm pull cwv/cwv --version ${version} succeeded."
