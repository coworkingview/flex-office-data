<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>CoworkingView dashboard widget</title>
	<link rel="stylesheet" href="../css/coworkingview-dashboard.css">
	<style>
		:root {
			--color-main-text: #222222;
			--color-text-maxcontrast: #6b6b6b;
			--color-border: #e6e6e6;
			--color-main-background: #ffffff;
			--color-primary-element: #006aa3;
			--color-primary-element-text: #ffffff;
			--border-radius: 8px;
			--border-radius-pill: 100px;
			--font-size-small: 13px;
		}
		body {
			margin: 0;
			background: #f5f5f5;
			color: var(--color-main-text);
			font-family: "Segoe UI", system-ui, sans-serif;
		}
		.page {
			max-width: 920px;
			margin: 0 auto;
			padding: 28px 24px 40px;
		}
		.page h1 {
			margin: 0 0 18px;
			font-size: 28px;
			font-weight: 600;
		}
		.widget {
			max-width: 460px;
			background: #fff;
			border: 1px solid #ededed;
			border-radius: 16px;
			box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
		}
		.widget__header {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 12px 16px;
			border-bottom: 1px solid #ededed;
			font-weight: 600;
		}
		.widget__header img {
			width: 20px;
			height: 20px;
			border-radius: 4px;
		}
		.widget__body {
			padding: 8px 16px 12px;
		}
		a { color: #006aa3; }
	</style>
</head>
<body>
	<div class="page">
		<h1>Dashboard</h1>
		<section class="widget" aria-label="CoworkingView">
			<div class="widget__header">
				<img src="../img/app.png" alt="">
				<span>CoworkingView</span>
			</div>
			<div class="widget__body" id="coworkingview-widget"></div>
		</section>
	</div>
	<script>
		window.OCA = {
			Dashboard: {
				register(id, render) {
					render(document.getElementById('coworkingview-widget'), { widget: { title: 'CoworkingView' } })
				},
			},
		}
	</script>
	<script src="./data.js"></script>
	<script src="../js/coworkingview-dashboard.mjs"></script>
</body>
</html>
