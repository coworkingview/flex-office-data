[package]
name = "coworkingview"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Client and CLI (`cwv`) for the CoworkingView Price Index (flexible-office prices by city, CC BY 4.0) and coworking catalogue search."
license = "MIT"
authors = ["CoworkingView <info@coworkingview.com>"]
repository = "https://github.com/coworkingview/flex-office-data"
homepage = "https://coworkingview.com"
documentation = "https://docs.rs/coworkingview"
readme = "README.md"
keywords = ["coworking", "real-estate", "office", "price-index", "cli"]
categories = ["command-line-utilities", "api-bindings"]
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CHANGELOG.md", "/LICENSE"]
default-run = "cwv"

[lib]
name = "coworkingview"
path = "src/lib.rs"

[[bin]]
name = "cwv"
path = "src/bin/cwv/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
## Builds the `cwv` command-line tool. Library users can opt out with
## `default-features = false` to drop clap and the table renderer.
cli = ["dep:clap", "dep:clap_complete", "dep:clap_mangen", "dep:comfy-table"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
thiserror = "2.0.17"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "gzip"] }

clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"], optional = true }
clap_complete = { version = "4.6.11", optional = true }
clap_mangen = { version = "0.3.3", optional = true }
comfy-table = { version = "8.0.1", optional = true }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.docs.rs]
no-default-features = true
