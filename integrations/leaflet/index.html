<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>leaflet-coworkingview</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
    crossorigin=""
  >
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; font: 14px/1.4 system-ui, sans-serif; color: #1b1b1b; }
    #status { margin: 0; padding: 8px 12px; background: #f4f1ea; }
    #map { flex: 1; min-height: 240px; }
  </style>
</head>
<body>
  <p id="status" role="status">Loading the CoworkingView Price Index…</p>
  <div id="map" role="application" aria-label="Map of CoworkingView Price Index medians by city"></div>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
    crossorigin=""
  ></script>
  <script src="dist/leaflet-coworkingview.js"></script>
  <script>
    var statusNode = document.getElementById('status');
    var map = L.map('map').setView([50, 10], 4);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    var prices = L.coworkingView.layer({ fitBounds: true });
    prices.on('load', function (event) {
      var skipped = event.unlocated.length
        ? ' Skipped without coordinates: ' + event.unlocated.join(', ') + '.'
        : '';
      statusNode.textContent = event.cities + ' cities. ' + (event.attribution || '') + skipped;
    });
    prices.on('error', function (event) {
      statusNode.textContent = 'Could not load the Price Index (' + event.error.code + '). ' +
        'The API allows browser requests from https://coworkingview.com. ' +
        'On another origin, serve this page there or point the layer url option at a same-origin proxy. ' +
        event.error.message;
    });
    prices.addTo(map);
  </script>
</body>
</html>
