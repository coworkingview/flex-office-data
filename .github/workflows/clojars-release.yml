name: Release to Clojars

# Publishes integrations/clojure to Clojars when a tag clojure-v* is pushed.
# CLOJARS_PASSWORD is a Clojars deploy token. This workflow does not create
# the tag.

on:
  push:
    tags: ["clojure-v*"]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy net.clojars.coworkingview/coworkingview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/clojure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.6.1673

      - name: Check the bundled snapshot
        run: python3 tools/build_snapshot.py --check

      - name: Run tests
        run: clojure -M:test

      - name: Build the jar
        run: clojure -T:build jar

      - name: Check the generated pom
        run: python3 tools/check_pom.py

      - name: Deploy to Clojars
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -T:build deploy
