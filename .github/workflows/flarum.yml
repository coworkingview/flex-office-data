name: Flarum

on:
  pull_request:
    paths:
      - "integrations/flarum/**"
      - ".github/workflows/flarum.yml"
  push:
    branches: [main]
    paths:
      - "integrations/flarum/**"
      - ".github/workflows/flarum.yml"

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3"]
    defaults:
      run:
        working-directory: integrations/flarum
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Validate composer.json
        run: composer validate --strict --no-check-publish
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: php tests/run.php

  javascript:
    name: JavaScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/flarum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/flarum/js/package-lock.json
      - name: Build
        working-directory: integrations/flarum/js
        run: npm ci && npm run build
      - name: Built files are committed
        working-directory: integrations/flarum
        run: git diff --exit-code -- js/dist
