name: Flarum

on:
  pull_request:
    paths:
      - "flarum/**"
      - ".github/workflows/flarum.yml"
  push:
    branches: [main]
    paths:
      - "flarum/**"
      - ".github/workflows/flarum.yml"

permissions:
  contents: read

jobs:
  composer:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.4"]
    defaults:
      run:
        working-directory: flarum
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-version --no-check-publish

      - name: Unit tests
        run: composer update --no-interaction --prefer-dist && composer test

  javascript:
    name: Build admin JS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flarum/js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: flarum/js/package-lock.json

      - name: Install and build
        run: npm ci && npm run build

      - name: Committed dist matches this build
        run: git diff --exit-code -- dist
