<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Market Rate</title>
		<script src="sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="City">
			<sdpi-select
				setting="city"
				datasource="getCities"
				default="berlin"
				loading="Loading cities..."
				placeholder="Choose a city"
			></sdpi-select>
		</sdpi-item>
		<sdpi-item label="Figure">
			<sdpi-select setting="figure" default="flex_desk">
				<option value="flex_desk">Flex desk, monthly median</option>
				<option value="fix_desk">Fixed desk, monthly median</option>
				<option value="private_office">Private office, monthly median</option>
				<option value="day_pass">Day pass, daily median</option>
				<option value="meeting_room">Meeting room, hourly median</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="Website">
			<button class="sdpi-item-value" type="button" id="open-site">coworkingview.com</button>
		</sdpi-item>
		<script>
			document.querySelector("#open-site").addEventListener("click", () => {
				SDPIComponents.streamDeckClient.send("sendToPlugin", { event: "openSite" });
			});
		</script>
	</body>
</html>
